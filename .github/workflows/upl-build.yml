name: UPL Build

# The push trigger is disabled since the UefiPayloadPkg build depends on pylibfdt which
# currently fails to install. workflow_dispatch is left as that still allows the workflow
# to be run manually. It also allows the workflow to be excluded from automatic triggers
# at the workflow level instead of at the job level which would require more changes in
# the file.
on:
  workflow_dispatch:
  # push:
  #   branches: ['master']

jobs:
  build_vs2026:
    strategy:
      matrix:
        os: [windows-2025]
        python-version: ['3.12']
        tool-chain: ['VS2026']
        target: ['DEBUG']
        extra-build-args: ['FIT_BUILD=TRUE', 'FIT_BUILD=FALSE']
    name: Build UPL VS2026
    uses: ./.github/workflows/BuildPlatform.yml
    with:
      runs-on: ${{ matrix.os }}
      build-file: 'UefiPayloadPkg/PlatformCI/PlatformBuild.py'
      python-version: ${{ matrix.python-version }}
      tool-chain: ${{ matrix.tool-chain }}
      target: ${{ matrix.target }}
      extra-build-args: ${{ matrix.extra-build-args }}
      extra-artifact-path: |
        Build/**/*.elf
        Build/**/*.fit
    secrets: inherit

  build_gcc:
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.12']
        tool-chain: ['GCC']
        target: ['DEBUG']
        extra-build-args: ['FIT_BUILD=TRUE', 'FIT_BUILD=FALSE']
    name: Build UPL GCC
    uses: ./.github/workflows/BuildPlatform.yml
    with:
      runs-on: ${{ matrix.os }}
      build-file: 'UefiPayloadPkg/PlatformCI/PlatformBuild.py'
      python-version: ${{ matrix.python-version }}
      tool-chain: ${{ matrix.tool-chain }}
      target: ${{ matrix.target }}
      extra-build-args: ${{ matrix.extra-build-args }}
      extra-setup-cmd: 'sudo dnf install -y llvm clang llvm-libs llvm-devel lldb'
      extra-artifact-path: |
        Build/**/*.elf
        Build/**/*.fit
