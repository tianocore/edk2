name: Sync Labels from Issue to PR

on:
  pull_request_target:
    types:
      - edited
      - opened
      - reopened
      - synchronize
      - review_requested
      - ready_for_review

  workflow_dispatch:

jobs:
  sync-labels:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Copy Labels from Linked Issue
        uses: michalvankodev/copy-issue-labels@v2.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}