name: Build QEMU firmware

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: x86_64
            arch: X64
            dsc: OvmfPkg/OvmfPkgX64.dsc
            output_dir: Build/OvmfX64/RELEASE_GCC/FV
            artifact_name: qube-ovmf-x86_64
          - label: AArch64
            arch: AARCH64
            dsc: ArmVirtPkg/ArmVirtQemu.dsc
            output_dir: Build/ArmVirtQemu-AArch64/RELEASE_GCC/FV
            artifact_name: qube-ovmf-aarch64

    steps:
      - name: Check out EDK II (including submodules)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            acpica-tools \
            binutils-aarch64-linux-gnu \
            build-essential \
            gcc-aarch64-linux-gnu \
            nasm \
            uuid-dev

      - name: Install EDK II Python requirements
        run: python -m pip install -r pip-requirements.txt

      - name: Build BaseTools
        run: make -C BaseTools -j"$(nproc)"

      - name: Resolve EDK II source base date
        run: |
          git fetch --no-tags https://github.com/tianocore/edk2.git master
          source_base_commit="$(git merge-base HEAD FETCH_HEAD)"
          source_base_date="$(git show -s --format=%cs "$source_base_commit")"
          echo "SOURCE_BASE_DATE=$source_base_date" >> "$GITHUB_ENV"

      - name: Build firmware
        env:
          GCC_AARCH64_PREFIX: aarch64-linux-gnu-
        run: |
          set -eo pipefail
          source ./edksetup.sh
          build -a "${{ matrix.arch }}" \
            -b RELEASE \
            -t GCC \
            -p "${{ matrix.dsc }}"

          mkdir -p dist
          output_dir="${{ matrix.output_dir }}"
          if [[ "${{ matrix.arch }}" == "X64" ]]; then
            cp "$output_dir/OVMF_CODE.fd" dist/
            cp "$output_dir/OVMF_VARS.fd" dist/
            cp "$output_dir/OVMF.fd" dist/
          else
            cp "$output_dir/QEMU_EFI.fd" dist/
            cp "$output_dir/QEMU_VARS.fd" dist/
          fi

          printf 'build_date: %s\nsource_base: %s\n' \
            "$(date -u +%Y-%m-%d)" "$SOURCE_BASE_DATE" > dist/build-info.yml

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
